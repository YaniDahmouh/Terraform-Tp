---
- name: Installer Engine-X (Nginx)
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: yes

- name: Déployer le Vhost Nginx via Jinja2
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  notify: Reload nginx

- name: Déployer l'application web avec JS dynamique
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_doc_root }}/index.html"
    owner: www-data
    group: www-data
    mode: '0644'

- name: Démarrer et activer Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
