---
- name: Installer UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Autoriser SSH (Port 22)
  community.general.ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Autoriser HTTP (Port 80)
  community.general.ufw:
    rule: allow
    port: '80'
    proto: tcp

- name: Activer UFW
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
