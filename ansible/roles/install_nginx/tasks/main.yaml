---
- name: Apt instal nginx
  become: true # elevation de privi
  ansible.builtin.apt:
    state: present
    name: nginx
    update_cache: true
- name: Start the service
  become: true
  ansible.builtin.service:
    state: started
    name: nginx
    enabled: true
# Il manque qqch ici qui dira de changer
# la configuration de nginx ou d'ajouter des
# fichiers web ( css js et html )
